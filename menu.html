<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Brew &amp; Co — демо QR-меню кофейни</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1EA;--card:#fff;--ink:#1F1A16;--mute:#8A7D72;--brand:#2F5D50;--brand2:#E8F0EC;--line:#EAE2D8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Manrope','Montserrat',system-ui,sans-serif;background:#E9E2D8;color:var(--ink)}
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:120px;box-shadow:0 0 60px rgba(0,0,0,.08)}
.demo{background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:7px}
.hero{position:relative;height:260px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(20,15,10,.75))}
.hero .t{position:absolute;left:22px;right:22px;bottom:22px;color:#fff;z-index:2}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:14px;opacity:.85;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:12px}
.chips span{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:20px;padding:6px 12px;font-size:12px}
.tabs{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:16px 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cat{padding:6px 18px 0}
.cat h2{font-size:22px;font-weight:800;margin:14px 0 12px}
.item{display:flex;gap:14px;background:var(--card);border-radius:20px;padding:12px;margin-bottom:12px;align-items:center}
.ph{flex:none;width:92px;height:92px;border-radius:16px;object-fit:cover;background:linear-gradient(135deg,#E8DCCB,#CDB79A);display:flex;align-items:center;justify-content:center;font-size:38px}
.info{flex:1;min-width:0}
.info b{font-size:16px;display:block}
.info small{color:var(--mute);font-size:13px;display:block;margin:3px 0 8px;line-height:1.35}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;font-size:16px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand2);color:var(--brand);font-size:22px;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:18px;cursor:pointer}
.tag{display:inline-block;background:#FCE9D9;color:#B4602A;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:448px;display:flex;gap:10px;z-index:30}
.cart{flex:1;background:var(--brand);color:#fff;border-radius:22px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700;border:0;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 14px 30px rgba(47,93,80,.35)}
.waiter{flex:none;width:58px;border-radius:22px;border:0;background:var(--ink);color:#fff;font-size:22px;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:40;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:26px 22px 34px}
.sheet h3{font-size:22px;margin-bottom:14px}
.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:16px 0}
.go{width:100%;border:0;background:var(--brand);color:#fff;border-radius:18px;padding:16px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:12px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;transition:transform .3s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

];
const cart={};const fmt=n=>n.toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';
const tabs=document.getElementById('tabs'),menu=document.getElementById('menu');
M.forEach((g,gi)=>{
 const t=document.createElement('div');t.className='tab'+(gi?'':' on');t.textContent=g.c;t.onclick=()=>{document.getElementById('c'+gi).scrollIntoView({behavior:'smooth',block:'start'});};tabs.appendChild(t);
 const s=document.createElement('div');s.className='cat';s.id='c'+gi;s.style.scrollMarginTop='70px';s.innerHTML='<h2>'+g.c+'</h2>';
 g.items.forEach((it,ii)=>{const id=gi+'_'+ii;const el=document.createElement('div');el.className='item';
  el.innerHTML=(it.img?'<img class="ph" src="'+it.img+'">':'<div class="ph">'+it.e+'</div>')+'<div class="info"><b>'+it.n+(it.h?'<span class="tag">ХИТ</span>':'')+'</b><small>'+it.d+'</small><div class="row"><span class="price">'+fmt(it.p)+'</span><span id="q'+id+'"></span></div></div>';
  s.appendChild(el);it.id=id;});
 menu.appendChild(s);});
const all={};M.forEach(g=>g.items.forEach(i=>all[i.id]=i));
function draw(id){const q=cart[id]||0,box=document.getElementById('q'+id);
 box.innerHTML=q?'<span class="qty"><button data-a="-" data-i="'+id+'">−</button><b>'+q+'</b><button data-a="+" data-i="'+id+'">+</button></span>':'<button class="add" data-a="+" data-i="'+id+'">+</button>';
 let n=0,s=0;for(const k in cart){n+=cart[k];s+=cart[k]*all[k].p;}
 document.getElementById('cnt').textContent=n?('Корзина · '+n+' поз.'):'Корзина пуста';document.getElementById('sum').textContent=fmt(s);}
Object.keys(all).forEach(draw);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.dataset.i;cart[id]=(cart[id]||0)+(b.dataset.a=='+'?1:-1);if(cart[id]<=0)delete cart[id];draw(id);});
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);};
document.getElementById('waiter').onclick=()=>toast('Официант уже идёт к столу №7 🙂');
const sheet=document.getElementById('sheet');
document.getElementById('cartBtn').onclick=()=>{let h='',s=0;for(const k in cart){h+='<div class="line"><span>'+all[k].n+' × '+cart[k]+'</span><b>'+fmt(cart[k]*all[k].p)+'</b></div>';s+=cart[k]*all[k].p;}
 if(!h){toast('Добавьте что-нибудь вкусное ☕');return;}document.getElementById('lines').innerHTML=h;document.getElementById('tot').textContent=fmt(s);sheet.style.display='flex';};
sheet.onclick=e=>{if(e.target===sheet)sheet.style.display='none';};
document.getElementById('go').onclick=()=>{sheet.style.display='none';toast('Заказ принят! Это демо-меню ☕');};
const secs=[...document.querySelectorAll('.cat')];window.addEventListener('scroll',()=>{let i=0;secs.forEach((s,k)=>{if(s.getBoundingClientRect().top<120)i=k;});[...tabs.children].forEach((t,k)=>t.classList.toggle('on',k===i));});
</script>
